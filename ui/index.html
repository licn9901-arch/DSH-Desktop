<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b1220;
      color: #e5e7eb;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box { text-align: center; }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      border: 4px solid #1e3a8a;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: .7; font-size: 13px; max-width: 420px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div>正在启动 DeepSeek Harness…</div>
    <p>首次启动通常需要 5–30 秒。如果长时间停留在此页，请查看
      %LOCALAPPDATA%\dsh-desktop\dsh-desktop.log 中的 host 日志。</p>
  </div>
</body>
</html>
