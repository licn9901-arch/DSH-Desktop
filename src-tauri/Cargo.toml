[package]
name = "dsh-desktop"
version = "0.1.0-preview.1"
description = "Tauri desktop shell for DeepSeek Harness"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
regex = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"

[profile.release]
strip = true
